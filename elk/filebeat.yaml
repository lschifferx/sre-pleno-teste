---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
  labels:
    app: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: /var/log/containers/

    processors:
      # Parse structured log lines emitted by the Go middleware:
      # timestamp=<ISO8601> level=<LEVEL> endpoint=<PATH> method=<METHOD> status=<CODE> latency=<N>ms size=<N>
      - dissect:
          tokenizer: "timestamp=%{log.timestamp} level=%{log.level} endpoint=%{url.path} method=%{http.request.method} status=%{http.response.status_code} latency=%{event.duration}ms size=%{http.response.body.bytes}"
          field: "message"
          target_prefix: ""
          ignore_failure: true
      - convert:
          fields:
            - {from: "http.response.status_code", type: integer}
            - {from: "event.duration", type: float}
            - {from: "http.response.body.bytes", type: integer}
          ignore_missing: true
          fail_on_error: false
      - add_tags:
          tags: ["error"]
          when:
            equals:
              log.level: "ERROR"
      - add_tags:
          tags: ["warning"]
          when:
            equals:
              log.level: "WARN"
      - drop_event:
          when:
            or:
              - equals:
                  url.path: "/health"
              - equals:
                  url.path: "/ready"
              - equals:
                  url.path: "/metrics"
              - contains:
                  kubernetes.namespace: kube-system
              - contains:
                  kubernetes.namespace: logging

    output.elasticsearch:
      # FQDN completo para resolução DNS confiável dentro do cluster.
      # O chart oficial do Elastic habilita TLS por padrão (xpack.security=true),
      # por isso usamos https:// e credenciais do Secret gerado automaticamente.
      # ssl.verification_mode: none aceita o certificado auto-assinado do chart.
      hosts: ["https://elasticsearch-master.logging.svc.cluster.local:9200"]
      username: "elastic"
      password: "${ELASTICSEARCH_PASSWORD}"
      ssl.verification_mode: "none"
      ssl.enabled: true
      index: "app-logs-%{[kubernetes.namespace]}-%{+yyyy.MM.dd}"

    setup.template.name: "app-logs"
    setup.template.pattern: "app-logs-*"
    setup.ilm.enabled: false

    logging.level: warning
    logging.to_files: false

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels:
    app: filebeat
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.13.0
          args: ["-c", "/etc/filebeat.yml", "-e"]

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-master-credentials
                  key: password

          securityContext:
            runAsUser: 0 # must read /var/log
            privileged: false

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, watch, list]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: logging
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
