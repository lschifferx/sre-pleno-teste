input {
  beats {
    port => 5044
  }
}

filter {
  # ── Parse structured log lines emitted by the Go middleware ──────────────
  # Format: timestamp=<ISO8601> level=<LEVEL> endpoint=<PATH> method=<METHOD>
  #         status=<CODE> latency=<N>ms size=<N>
  grok {
    match => {
      "message" => "timestamp=%{TIMESTAMP_ISO8601:log_timestamp} level=%{LOGLEVEL:log_level} endpoint=%{URIPATH:endpoint} method=%{WORD:http_method} status=%{NUMBER:http_status:int} latency=%{NUMBER:latency_ms:float}ms size=%{NUMBER:response_size:int}"
    }
    tag_on_failure => ["_grokparsefailure_structured"]
  }

  # ── Fallback: try to parse generic key=value pairs ───────────────────────
  if "_grokparsefailure_structured" in [tags] {
    kv {
      field_split => " "
      value_split => "="
      source => "message"
      target => "kv"
    }
  }

  # ── Normalise timestamp ───────────────────────────────────────────────────
  if [log_timestamp] {
    date {
      match => ["log_timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["log_timestamp"]
    }
  }

  # ── Enrich with Kubernetes metadata ──────────────────────────────────────
  mutate {
    add_field => {
      "environment" => "%{[kubernetes][namespace]}"
      "pod_name"    => "%{[kubernetes][pod][name]}"
      "app"         => "%{[kubernetes][labels][app]}"
    }
  }

  # ── Fallback: se o campo K8s não existiu, o valor literal fica como "%{...}"
  # Substitui por "unknown" para evitar poluição de índice e erros de mapeamento
  if [environment] =~ /^%\{/ {
    mutate { replace => { "environment" => "unknown" } }
  }
  if [pod_name] =~ /^%\{/ {
    mutate { replace => { "pod_name" => "unknown" } }
  }
  if [app] =~ /^%\{/ {
    mutate { replace => { "app" => "unknown" } }
  }

  # ── Tag error/warn for Kibana alert rules ────────────────────────────────
  if [log_level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }
  if [log_level] == "WARN" {
    mutate { add_tag => ["warning"] }
  }

  # ── Drop noise ───────────────────────────────────────────────────────────
  if [endpoint] == "/health" or [endpoint] == "/ready" or [endpoint] == "/metrics" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch-master:9200"]
    index  => "app-logs-%{environment}-%{+YYYY.MM.dd}"
    # Template so all numeric fields are mapped correctly
    template_name => "app-logs"
    template_overwrite => true
    manage_template => true
  }

  # Uncomment for local debugging
  # stdout { codec => rubydebug }
}
