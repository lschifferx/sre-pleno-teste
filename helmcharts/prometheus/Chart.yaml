apiVersion: v2
name: prometheus-stack
description: >
  Wrapper chart que instala o kube-prometheus-stack (Prometheus + Grafana +
  Alertmanager) com configuração ajustada para coletar métricas da aplicação
  sre-demo-app via annotations de pod e ServiceMonitor.
type: application
version: 1.0.0
appVersion: "v0.75.0"

# Dependência upstream — o chart real está no repositório prometheus-community
dependencies:
  - name: kube-prometheus-stack
    version: "58.7.2"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
