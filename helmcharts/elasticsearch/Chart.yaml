apiVersion: v2
name: elasticsearch
description: >
  Wrapper chart para o Elasticsearch (Elastic oficial) configurado para
  ambiente single-node local (minikube/kind) com security básica habilitada
  e credenciais expostas como Secret para consumo pelo Filebeat e Kibana.
type: application
version: 1.0.0
appVersion: "8.13.0"

dependencies:
  - name: elasticsearch
    version: "8.5.1"
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled
