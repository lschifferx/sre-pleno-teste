version: "3"

vars:
  APP_NAME: sre-demo-app
  IMAGE: "{{.APP_NAME}}:latest"
  NAMESPACE: sre-demo
  MONITORING_NS: monitoring
  LOGGING_NS: logging

tasks:

  setup:
    desc: "Bootstrap: minikube + namespaces + repositórios Helm"
    cmds:
      - minikube start --cpus=4 --memory=6144 --driver=docker
      - minikube addons enable metrics-server
      - kubectl create namespace {{.NAMESPACE}}     --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace {{.MONITORING_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create namespace {{.LOGGING_NS}}    --dry-run=client -o yaml | kubectl apply -f -
      - helm repo add elastic              https://helm.elastic.co
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo add argo                 https://argoproj.github.io/argo-helm
      - helm repo update

  lint:
    desc: "Lint do Dockerfile com hadolint"
    cmds:
      - docker run --rm -i hadolint/hadolint < Dockerfile

  build:
    desc: "Build da imagem Docker dentro do daemon do minikube"
    cmds:
      - eval $(minikube docker-env) && docker build -t {{.IMAGE}} .

  deploy:
    desc: "Aplica todos os manifests K8s e aguarda o rollout"
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f k8s/service.yaml
      - kubectl apply -f k8s/deployment.yaml
      - kubectl apply -f k8s/hpa.yaml
      - kubectl apply -f k8s/pdb.yaml
      - kubectl rollout status deployment/{{.APP_NAME}} -n {{.NAMESPACE}} --timeout=90s

  rollback:
    desc: "Desfaz o último deployment"
    cmds:
      - kubectl rollout undo deployment/{{.APP_NAME}} -n {{.NAMESPACE}}

  # ── Observabilidade via helmcharts/ (sem scripts) ───────────────────────────

  install-prometheus:
    desc: "Instala Prometheus + Grafana via helmcharts/prometheus"
    cmds:
      - helm dependency update helmcharts/prometheus
      - |
        helm upgrade --install prometheus-stack \
          helmcharts/prometheus \
          --namespace {{.MONITORING_NS}} \
          --values helmcharts/prometheus/values.yaml \
          --timeout 10m \
          --wait

  install-elasticsearch:
    desc: "Instala Elasticsearch via helmcharts/elasticsearch"
    cmds:
      - helm dependency update helmcharts/elasticsearch
      - |
        helm upgrade --install elasticsearch \
          helmcharts/elasticsearch \
          --namespace {{.LOGGING_NS}} \
          --values helmcharts/elasticsearch/values.yaml \
          --timeout 10m \
          --wait

  install-kibana:
    desc: "Instala Kibana via helmcharts/kibana (substitui install-kibana.sh)"
    cmds:
      - helm dependency update helmcharts/kibana
      - |
        helm upgrade --install kibana \
          helmcharts/kibana \
          --namespace {{.LOGGING_NS}} \
          --values helmcharts/kibana/values.yaml \
          --timeout 15m \
          --wait

  install-filebeat:
    desc: "Instala Filebeat via helmcharts/filebeat (substitui kubectl apply elk/filebeat.yaml)"
    cmds:
      - helm dependency update helmcharts/filebeat
      - |
        helm upgrade --install filebeat \
          helmcharts/filebeat \
          --namespace {{.LOGGING_NS}} \
          --values helmcharts/filebeat/values.yaml \
          --timeout 5m \
          --wait

  install-elk:
    desc: "Instala stack ELK completa via Helm: ES → Kibana → Filebeat"
    cmds:
      - task: install-elasticsearch
      - task: install-kibana
      - task: install-filebeat

  install-argocd:
    desc: "Instala Argo CD via helmcharts/argocd e registra a Application sre-demo-app"
    cmds:
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      - helm dependency update helmcharts/argocd
      - |
        helm upgrade --install argocd \
          helmcharts/argocd \
          --namespace argocd \
          --values helmcharts/argocd/values.yaml \
          --timeout 10m \
          --wait
      - kubectl apply -f k8s/argocd-app.yaml

  # ── Verificações de saúde ───────────────────────────────────────────────────

  check-prometheus:
    desc: "Verifica se o Prometheus está coletando métricas da sre-demo-app"
    cmds:
      - |
        echo "=== Targets do Prometheus ==="
        kubectl port-forward svc/prometheus-stack-kube-prom-prometheus \
          9090:9090 -n {{.MONITORING_NS}} >/dev/null 2>&1 &
        PF_PID=$!
        sleep 3
        curl -sf "http://localhost:9090/api/v1/targets?state=active" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        targets = data['data']['activeTargets']
        sre = [t for t in targets if 'sre-demo' in str(t.get('labels', {}))]
        print('Total targets ativos: ' + str(len(targets)))
        print('Targets sre-demo-app: ' + str(len(sre)))
        for t in sre:
            print('  job=' + t['labels'].get('job','') + ' state=' + t['health'] + ' url=' + t['scrapeUrl'])
        if not sre:
            print('AVISO: sre-demo-app nao encontrado nos targets. Verifique o ServiceMonitor.')
        "
        kill $PF_PID 2>/dev/null || true

  check-filebeat:
    desc: "Verifica se o Filebeat está enviando logs ao Elasticsearch"
    cmds:
      - |
        echo "=== Logs do pod Filebeat ==="
        FILEBEAT_POD=$(kubectl get pods -n {{.LOGGING_NS}} \
          -l app=filebeat-filebeat -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -z "${FILEBEAT_POD}" ]; then
          echo "ERRO: Nenhum pod Filebeat encontrado no namespace {{.LOGGING_NS}}"
          exit 1
        fi
        echo "Pod: ${FILEBEAT_POD}"
        kubectl logs "${FILEBEAT_POD}" -n {{.LOGGING_NS}} --tail=30
        echo ""
        echo "=== Indices no Elasticsearch (via HTTPS + credenciais) ==="
        ES_PASS=$(kubectl get secret elasticsearch-master-credentials \
          -n {{.LOGGING_NS}} -o jsonpath='{.data.password}' | base64 -d 2>/dev/null || echo "")
        kubectl port-forward svc/elasticsearch-master \
          9200:9200 -n {{.LOGGING_NS}} >/dev/null 2>&1 &
        PF_PID=$!
        sleep 3
        curl -sk -u "elastic:${ES_PASS}" \
          "https://localhost:9200/_cat/indices/app-logs-*?v&h=index,docs.count,store.size" \
          || echo "Nenhum indice app-logs-* ainda (normal nos primeiros minutos)"
        kill $PF_PID 2>/dev/null || true

  # ── Port-forwards ───────────────────────────────────────────────────────────

  port-forward-app:
    desc: "Port-forward da aplicação (localhost:8080)"
    cmds:
      - kubectl port-forward svc/{{.APP_NAME}} 8080:80 -n {{.NAMESPACE}}

  port-forward-grafana:
    desc: "Port-forward do Grafana (localhost:3000) — admin / sre-admin-2024"
    cmds:
      - kubectl port-forward svc/prometheus-stack-grafana 3000:80 -n {{.MONITORING_NS}}

  port-forward-kibana:
    desc: "Port-forward do Kibana (localhost:5601)"
    cmds:
      - kubectl port-forward svc/kibana-kibana 5601:5601 -n {{.LOGGING_NS}}

  port-forward-prometheus:
    desc: "Port-forward do Prometheus (localhost:9090)"
    cmds:
      - kubectl port-forward svc/prometheus-stack-kube-prom-prometheus 9090:9090 -n {{.MONITORING_NS}}

  port-forward-elasticsearch:
    desc: "Port-forward do Elasticsearch (localhost:9200)"
    cmds:
      - kubectl port-forward svc/elasticsearch-master 9200:9200 -n {{.LOGGING_NS}}

  port-forward-argocd:
    desc: "Port-forward do Argo CD (localhost:8888) — admin / sre-admin-2024"
    cmds:
      - kubectl port-forward svc/argocd-server 8888:80 -n argocd

  # ── Carga e validação ───────────────────────────────────────────────────────

  validate:
    desc: "Smoke test em todos os endpoints da aplicação"
    cmds:
      - |
        kubectl port-forward svc/{{.APP_NAME}} 18080:80 -n {{.NAMESPACE}} >/dev/null 2>&1 &
        PF_PID=$!
        sleep 2
        APP_URL="http://localhost:18080"
        echo "Testing ${APP_URL}"
        curl -sf "${APP_URL}/health"         | python3 -m json.tool
        curl -sf "${APP_URL}/ready"          | python3 -m json.tool
        curl -sf "${APP_URL}/metrics"        | head -20
        curl -sf "${APP_URL}/api/v1/ping"    | python3 -m json.tool
        curl -sf "${APP_URL}/api/v1/status"  | python3 -m json.tool
        kill $PF_PID 2>/dev/null || true

  stress:
    desc: "Gera carga para exercitar dashboards (600 requests)"
    cmds:
      - |
        kubectl port-forward svc/{{.APP_NAME}} 18080:80 -n {{.NAMESPACE}} >/dev/null 2>&1 &
        PF_PID=$!
        sleep 2
        APP_URL="http://localhost:18080"
        echo ">>> Enviando 600 requisições para ${APP_URL}..."
        for i in $(seq 1 200); do
          curl -s "${APP_URL}/api/v1/ping"             > /dev/null
          curl -s "${APP_URL}/api/v1/simulate/error"   > /dev/null
          curl -s "${APP_URL}/api/v1/simulate/latency" > /dev/null
        done
        kill $PF_PID 2>/dev/null || true
        echo "Concluido."

  # ── Teardown ────────────────────────────────────────────────────────────────

  clean:
    desc: "Remove os manifests da aplicação do cluster"
    cmds:
      - kubectl delete -f k8s/ --ignore-not-found

  destroy:
    desc: "Destrói o cluster minikube por completo"
    cmds:
      - minikube delete

  # ── All-in-one ──────────────────────────────────────────────────────────────

  all:
    desc: "Setup completo 100% Helm: minikube + Prometheus + ELK + ArgoCD + aplicação"
    cmds:
      - task: setup
      - task: build
      - task: deploy
      - task: install-prometheus
      - task: install-elk
      - task: install-argocd
